<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Menu (Same as homepage) -->
    <div class="side-menu" id="side-menu">
        <span id="close-menu">×</span>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login/Signup</a></li>
            <li><a href="maps.html">Maps</a></li>
            <li><a href="user.html">You</a></li>
        </ul>
    </div>

    <!-- Toggle button for menu -->
    <div class="menu-toggle" id="toggle-menu">
        <div></div><div></div><div></div>
    </div>

    <!-- Login form -->
    <div class="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="show-signup">Sign up here</a></p>
    </div>

    <!-- Signup form (hidden by default) -->
    <div class="signup-container" id="signup-container" style="display: none;">
        <h2>Signup</h2>
        <form id="signup-form">
            <input type="text" id="new-username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="new-password" placeholder="Password" required>
            <button type="submit">Sign up</button>
        </form>
        <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
